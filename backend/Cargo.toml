[workspace]
resolver = "2"
members = ["crates/core", "crates/ledger", "crates/api", "crates/chain"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
publish = false

# Every dependency is declared once here and inherited by the crates, so there
# is one place to review what the backend pulls in. Cargo.lock is committed.
[workspace.dependencies]
engipay-core = { path = "crates/core" }
engipay-ledger = { path = "crates/ledger" }

anyhow = "1"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Maintained by the Stellar Development Foundation.
stellar-strkey = "0.0"
stellar-xdr = { version = "28", default-features = false, features = ["std", "base64"] }
ed25519-dalek = { version = "2", features = ["zeroize"] }
sha2 = "0.10"
zeroize = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "migrate", "macros"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Money code: silent truncation and panics on arithmetic are bugs.
cast_possible_truncation = "deny"
arithmetic_side_effects = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
