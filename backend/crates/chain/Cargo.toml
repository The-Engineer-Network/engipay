[package]
name = "engipay-chain"
description = "Chain service: deposit watching, transaction building and signing. The only service that ever holds keys."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
engipay-core.workspace = true
engipay-ledger = { workspace = true, features = ["postgres"] }
anyhow.workspace = true
# Internal HTTP API the api service calls (POST /internal/estimate-fee).
axum.workspace = true
chrono.workspace = true
ed25519-dalek.workspace = true
hex.workspace = true
lru.workspace = true
futures-core.workspace = true
futures-util.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
# SEP-24 encodes its query parameters, and `sep24.rs` builds them.
serde_urlencoded.workspace = true
sha2.workspace = true
# `json` is required by the JSONB columns selected in `dlq_commands.rs`.
sqlx = { workspace = true, features = ["json"] }
stellar-strkey.workspace = true
stellar-xdr.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util = { workspace = true, features = ["rt"] }
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
zeroize.workspace = true

[dev-dependencies]
tower = { workspace = true, features = ["util"] }
wiremock = "0.6"

[lints]
workspace = true
