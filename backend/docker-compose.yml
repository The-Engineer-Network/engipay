# Local development stack.
#
#   docker compose up -d postgres api chain    start database, API and chain service
#   docker compose run --rm toolbox cargo test
#
# Ports are bound to 127.0.0.1 only, so nothing is reachable from your network.

name: engipay

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-engipay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in backend/.env}
      POSTGRES_DB: ${POSTGRES_DB:-engipay}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-engipay} -d ${POSTGRES_DB:-engipay}"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      args:
        BIN: engipay-api
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-engipay}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-engipay}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      BIND_ADDR: 0.0.0.0:8080
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # Chain service: Stellar deposit watching and payment signing.
  # The only process that holds signing keys; kept separate from the API so
  # compromising the API does not give access to keys.
  chain:
    build:
      context: .
      args:
        BIN: engipay-chain
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-engipay}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-engipay}
      STELLAR_CUSTODY_ACCOUNT: ${STELLAR_CUSTODY_ACCOUNT:-}
      STELLAR_SIGNING_KEY: ${STELLAR_SIGNING_KEY:-}
      BIND_ADDR: 0.0.0.0:8081
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  # Rust tooling for development: build, test, lint. Nothing is installed on the host.
  toolbox:
    build:
      context: .
      dockerfile: toolbox.Dockerfile
    working_dir: /work
    volumes:
      - .:/work
      - cargo-registry:/usr/local/cargo/registry
      - cargo-target:/work/target
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-engipay}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-engipay}
    profiles: ["tools"]

volumes:
  postgres-data:
  cargo-registry:
  cargo-target:
