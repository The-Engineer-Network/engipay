version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      wallet:
        patterns: ["wagmi", "viem", "@rainbow-me/*", "@stellar/*"]
      radix:
        patterns: ["@radix-ui/*"]

  - package-ecosystem: cargo
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
