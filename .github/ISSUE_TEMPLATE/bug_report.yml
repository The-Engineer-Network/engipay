name: Bug report
description: Something in EngiPay does not work as it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. If this is a security problem, do not open an issue: follow SECURITY.md instead.
        Never paste a secret key, seed phrase or API key here.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Connect Freighter on testnet
        2. Open Send and choose Stellar
        3. ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Web app
        - Wallet connection
        - Payment codes (QR)
        - Stellar
        - Base
        - Backend API
        - Chain service
        - Docs
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser, wallet and network
      placeholder: Chrome 140, Freighter 5.x, Stellar testnet
