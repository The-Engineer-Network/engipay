name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only token, no secrets. Pull requests from forks run exactly this, so
# there is nothing here for a malicious pull request to steal.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web app
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # --ignore-scripts: dependency install scripts never run in CI. The
      # September 2026 compromise spread through code that ran on install and build.
      - name: Install
        run: npm ci --ignore-scripts --no-fund

      - name: Type check
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: SDK staleness check
        run: |
          # Start the API without a database so /v1/openapi.json is reachable.
          docker run --rm --network host \
            -v "${{ github.workspace }}/backend:/work" \
            -w /work \
            engipay-toolbox:latest \
            bash -c "
              cargo build -p engipay-api -q 2>&1 &&
              BIND_ADDR=127.0.0.1:8080 ./target/debug/engipay-api &
              sleep 2 &&
              curl -sf http://127.0.0.1:8080/v1/openapi.json | python3 -m json.tool --indent 2 > lib/openapi.json
            " 2>&1 || true
          npm run check:sdk

      - name: Dependency audit
        run: npm audit --audit-level=high

  backend:
    name: Backend (Rust)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Format
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked

  database:
    name: Ledger guarantees (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Start Postgres
        run: |
          echo "POSTGRES_PASSWORD=ci-only-not-a-secret" > .env
          docker compose up -d --wait postgres

      - name: Database refuses ledger corruption
        run: bash ./scripts/test-db-guarantees.sh
