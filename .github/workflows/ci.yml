name: CI

on:
  pull_request:
  push:
    branches: [main, drips]

# Read-only token, no secrets. Pull requests from forks run exactly this, so
# there is nothing here for a malicious pull request to steal.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web app
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # --ignore-scripts: dependency install scripts never run in CI. The
      # September 2026 compromise spread through code that ran on install and build.
      - name: Install
        run: npm ci --ignore-scripts --no-fund

      - name: Type check
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Dependency audit
        run: npm audit --audit-level=high

  backend:
    name: Backend (Rust)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Format
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked

  database:
    name: Ledger guarantees (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Start Postgres
        run: |
          echo "POSTGRES_PASSWORD=ci-only-not-a-secret" > .env
          docker compose up -d --wait postgres

      - name: Verify migrations are idempotent
        run: bash ./scripts/verify-migrations.sh

      - name: Database refuses ledger corruption
        run: bash ./scripts/test-db-guarantees.sh

      - name: PostgreSQL ledger operations
        run: cargo test -p engipay-ledger postgres_queries_settlement_and_sender_locking
        env:
          DATABASE_URL: postgres://engipay:ci-only-not-a-secret@localhost:5432/engipay
